name: Generate blog cover image
on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS entry action payload
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: blog-cover-generation
  cancel-in-progress: false
jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check image workflow
        run: python -m unittest discover -s tests -p test_generate_blog_cover.py
      - name: Generate and save this post's cover
        env:
          PAGES_CMS_PAYLOAD: ${{ inputs.payload }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_blog_cover.py
      - name: Keep a copy of the generated image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-cover-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/generated-cover/cover.webp
          if-no-files-found: ignore
          retention-days: 7
